[tool.poetry]
name = "gripper-ai-controller"
version = "0.1.0"
description = "A safety-gated foundation for vision and sensor guided gripper control."
authors = ["Robotic Project Team"]
readme = "README.md"
packages = [{ include = "gripper_ai_controller", from = "src" }]
exclude = [
    "src/gripper_ai_controller/adapters/jaka/jkrc.pyd",
    "src/gripper_ai_controller/adapters/jaka/jakaAPI.dll",
    "src/gripper_ai_controller/adapters/hikvision/LICENSE-notice.txt",
    "src/gripper_ai_controller/adapters/hikvision/sdk/**",
    "src/gripper_ai_controller/adapters/hikvision/runtime/**",
]

[tool.poetry.dependencies]
python = ">=3.7,<3.8"
pyzmq = "25.1.2"
cbor = "1.0.0"
fastapi = "0.99.1"
uvicorn = "0.22.0"
Pillow = "9.5.0"
numpy = "1.21.6"
opencv-contrib-python-headless = "4.9.0.80"
torch = { version = "1.13.1", source = "pytorch-cu117" }
torchvision = { version = "0.14.1", source = "pytorch-cu117" }

[tool.poetry.scripts]
gripper-ai-controller = "gripper_ai_controller.cli:main"

[tool.poetry.group.dev.dependencies]
# FastAPI's TestClient uses this only in the offline HTTP contract test suite.
httpx = "0.24.1"


[[tool.poetry.source]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
priority = "explicit"

[build-system]
requires = ["poetry-core==1.6.1"]
build-backend = "poetry.core.masonry.api"
