<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAKA机器人3D可视化测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 1rem 2rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    .subtitle {
      margin-top: 0.25rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .viewer-container {
      flex: 1;
      position: relative;
      background: #0f172a;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      width: 320px;
      background: #1e293b;
      border-left: 1px solid #334155;
      padding: 1.5rem;
      overflow-y: auto;
    }
    .control-group {
      margin-bottom: 1.5rem;
    }
    .control-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #cbd5e1;
    }
    .slider-container {
      margin-bottom: 1rem;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #3b82f6;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 0.625rem 1rem;
      margin-top: 0.5rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    button.secondary {
      background: #475569;
    }
    button.secondary:hover {
      background: #334155;
    }
    .info-overlay {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      border: 1px solid rgba(71, 85, 105, 0.3);
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .spinner {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1rem;
      border: 4px solid rgba(59, 130, 246, 0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>🤖 JAKA Zu3 机器人3D可视化</h1>
      <p class="subtitle">Three.js + URDF模型加载测试</p>
    </div>
    <div class="content">
      <div class="viewer-container">
        <canvas id="canvas"></canvas>
        <div class="info-overlay">
          鼠标左键: 旋转 | 右键: 平移 | 滚轮: 缩放
        </div>
        <div id="loading" class="loading" style="display: none;">
          <div class="spinner"></div>
          <p>加载URDF模型中...</p>
        </div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>关节角度控制</label>
          <div class="slider-container">
            <div class="slider-label">
              <span>J1 (Base)</span>
              <span id="j1-value">0.00°</span>
            </div>
            <input type="range" id="j1" min="-350" max="350" value="0" step="1">
          </div>
          <div class="slider-container">
            <div class="slider-label">
              <span>J2 (Shoulder)</span>
              <span id="j2-value">0.00°</span>
            </div>
            <input type="range" id="j2" min="-75" max="255" value="0" step="1">
          </div>
          <div class="slider-container">
            <div class="slider-label">
              <span>J3 (Elbow)</span>
              <span id="j3-value">0.00°</span>
            </div>
            <input type="range" id="j3" min="-165" max="165" value="0" step="1">
          </div>
          <div class="slider-container">
            <div class="slider-label">
              <span>J4 (Wrist 1)</span>
              <span id="j4-value">0.00°</span>
            </div>
            <input type="range" id="j4" min="-75" max="255" value="0" step="1">
          </div>
          <div class="slider-container">
            <div class="slider-label">
              <span>J5 (Wrist 2)</span>
              <span id="j5-value">0.00°</span>
            </div>
            <input type="range" id="j5" min="-350" max="350" value="0" step="1">
          </div>
          <div class="slider-container">
            <div class="slider-label">
              <span>J6 (Wrist 3)</span>
              <span id="j6-value">0.00°</span>
            </div>
            <input type="range" id="j6" min="-350" max="350" value="0" step="1">
          </div>
        </div>
        <button id="reset-btn" class="secondary">重置到零位</button>
        <button id="demo-btn">演示动作</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/controls/OrbitControls.js';
    import URDFLoader from 'https://cdn.jsdelivr.net/npm/urdf-loader@0.13.1/src/URDFLoader.js';

    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(
      50,
      canvas.clientWidth / canvas.clientHeight,
      0.1,
      1000
    );
    camera.position.set(2, 2, 2);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(5, 10, 7.5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    const fillLight = new THREE.DirectionalLight(0x8ba8d0, 0.3);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);

    // Grid
    const gridHelper = new THREE.GridHelper(10, 10, 0x334155, 0x1e293b);
    scene.add(gridHelper);

    // Axes helper
    const axesHelper = new THREE.AxesHelper(1);
    scene.add(axesHelper);

    // Load URDF
    let robot = null;
    loading.style.display = 'block';

    const loader = new URDFLoader();
    loader.load(
      '/models/jaka_zu3.urdf',
      (result) => {
        robot = result;
        robot.traverse((child) => {
          if (child instanceof THREE.Mesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        scene.add(robot);
        loading.style.display = 'none';
        console.log('URDF loaded:', robot);
      },
      undefined,
      (error) => {
        console.error('Failed to load URDF:', error);
        loading.innerHTML = '<p style="color: #ef4444;">模型加载失败</p>';
      }
    );

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Handle resize
    function handleResize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    new ResizeObserver(handleResize).observe(canvas.parentElement);

    // Joint controls
    const jointInputs = ['j1', 'j2', 'j3', 'j4', 'j5', 'j6'].map(id => document.getElementById(id));
    const jointLabels = ['j1', 'j2', 'j3', 'j4', 'j5', 'j6'].map(id => document.getElementById(id + '-value'));

    function updateJointAngles() {
      if (!robot) return;

      jointInputs.forEach((input, i) => {
        const degrees = parseFloat(input.value);
        const radians = degrees * Math.PI / 180;
        const jointName = `joint${i + 1}`;

        if (robot.joints[jointName]) {
          robot.joints[jointName].setJointValue(radians);
        }

        jointLabels[i].textContent = degrees.toFixed(2) + '°';
      });
    }

    jointInputs.forEach(input => {
      input.addEventListener('input', updateJointAngles);
    });

    // Reset button
    document.getElementById('reset-btn').addEventListener('click', () => {
      jointInputs.forEach(input => input.value = 0);
      updateJointAngles();
    });

    // Demo button
    document.getElementById('demo-btn').addEventListener('click', () => {
      const poses = [
        [0, 45, -90, 0, 45, 0],
        [90, 30, -60, 45, 0, 90],
        [-90, 60, -120, -45, 90, -90],
        [0, 0, 0, 0, 0, 0]
      ];

      let step = 0;
      const interval = setInterval(() => {
        if (step >= poses.length) {
          clearInterval(interval);
          return;
        }

        poses[step].forEach((angle, i) => {
          jointInputs[i].value = angle;
        });
        updateJointAngles();
        step++;
      }, 1500);
    });
  </script>
</body>
</html>
